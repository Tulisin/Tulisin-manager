<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pesanan Tulisin</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--bd:#D3E4F7;--hero:#1D4F9C;--ink:#1F2A3B;--muted:#55657D;--blue:#1D4F9C;--soft:#E9F3FF;--line:#E1EDFA;
  --field:#B9D6F5;--btn:#1D4F9C;--btntxt:#FFFFFF;
  --g1:#7CC0FF;--g2:#3A84E6;--g3:#1F5CB8;
  --red-bg:#FFE3E0;--red:#A12A1B;--amb-bg:#FFF1D6;--amb:#8A5300;--grn-bg:#DDF5E6;--grn:#17683A;
  --display:'Caveat',cursive;--body:'Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;margin:0;padding:16px;padding-bottom:110px}
.wrap{max-width:520px;margin:0 auto}
header{margin:16px 0 0;padding:22px 20px 20px;border-radius:24px;background:var(--hero);color:#fff;display:flex;flex-direction:column;gap:12px}
header .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header .sub{font-size:16px;font-weight:700}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:46px;line-height:.95;color:#fff}
.gear{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;color:var(--ink)}
.stat b{font-size:24px;font-weight:800;color:var(--blue)}.stat span{font-size:12px;font-weight:700;color:var(--muted)}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
h2{margin:4px 0 0;font-size:15px;font-weight:800;color:var(--blue)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}.sm{font-size:13px}.b{font-weight:800}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--blue);white-space:nowrap}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amb{background:var(--amb-bg);color:var(--amb)}.pill.grn{background:var(--grn-bg);color:var(--grn)}
.box2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.box span{font-size:12px;font-weight:700;color:var(--muted)}.box b{font-size:15px;font-weight:800}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--btn);color:var(--btntxt);font-size:16px;font-weight:800;padding:0 16px;width:100%;cursor:pointer}
.btn.o{background:transparent;border:2px solid var(--blue);color:var(--blue);min-height:44px;font-size:14px;width:auto;border-radius:12px}
.btn.s{min-height:44px;font-size:14px;width:auto;border-radius:12px}
.btn.d{background:var(--red-bg);color:var(--red)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:pointer}
.item .nm{font-weight:800;font-size:17px;color:var(--blue)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--blue);font-size:14px;font-weight:800;cursor:pointer}
.tab.on{background:var(--btn);color:var(--btntxt);border-color:var(--btn)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800;color:var(--blue)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],textarea,select{
  min-height:48px;border:2px solid var(--field);border-radius:12px;padding:0 14px;font-size:16px;background:var(--card);width:100%}
textarea{padding:10px 14px;min-height:72px}
.chips{display:grid;gap:8px}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{min-height:48px;border-radius:12px;border:0;background:var(--soft);color:var(--blue);font-size:14px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btntxt)}.chip small{font-size:12px;font-weight:700}
.step{display:flex;align-items:center;gap:10px;min-height:52px}.step+.step{border-top:1px solid var(--line)}
.step .t{flex:1;font-weight:700}.step small{color:var(--muted)}
.rd{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);color:var(--blue);font-size:22px;font-weight:800;cursor:pointer}
.num{width:28px;text-align:center;font-weight:800}
.line{display:flex;justify-content:space-between;gap:10px}
.tot{border-top:1px solid var(--line);padding-top:10px;align-items:baseline}.tot b{font-size:26px;color:var(--blue)}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px;color:var(--blue);font-weight:800}
.monthbar button{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);color:var(--blue);font-size:20px;font-weight:800;cursor:pointer}
.big{font-size:32px;font-weight:800;color:var(--blue)}
.bars{display:grid;gap:12px;align-items:end;height:150px}
.bars>div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;font-size:12px;font-weight:800}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--g1)}
.track{height:10px;border-radius:999px;background:var(--soft)}.track i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.list>.row{min-height:48px}.list>.row+.row{border-top:1px solid var(--line)}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-weight:700;line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-radius:24px 24px 0 0;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px)) 12px;z-index:5;border-top:1px solid var(--bd)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;min-height:48px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
nav a.on{color:var(--blue);font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:9;max-width:90%}
.warn{background:var(--amb-bg);color:var(--amb);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;line-height:1.4}
</style>
</head>
<body>

<div class="wrap">
  <!-- Layar Login -->
  <div id="auth-screen" class="card" style="margin-top:40px; display:none;">
    <h2 style="font-size:24px; text-align:center;">Login Admin Tulisin</h2>
    <p class="sm muted" style="text-align:center;">Masukkan akun email dan password Anda untuk masuk ke aplikasi catatan keuangan.</p>
    <label class="f">Email<input type="email" id="login-email" placeholder="email@anda.com"></label>
    <label class="f">Password<input type="password" id="login-pass" placeholder="••••••••"></label>
    <button class="btn" id="btn-login">Masuk</button>
    <div id="login-err"></div>
  </div>

  <!-- Aplikasi Utama -->
  <div id="app-container" style="display:none;">
    <div id="app"></div>
  </div>
</div>

<nav id="nav" aria-label="Menu aplikasi" style="display:none;"></nav>
<div id="toast" class="toast" hidden></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Konfigurasi Firebase Anda
  const firebaseConfig = {
    apiKey: "AIzaSyBHM97_Kw8kAmv1dmpxTVKx8BKxtLJnssQ",
    authDomain: "tulisin-manager-2c52d.firebaseapp.com",
    projectId: "tulisin-manager-2c52d",
    storageBucket: "tulisin-manager-2c52d.firebasestorage.app",
    messagingSenderId: "130556428408",
    appId: "1:130556428408:web:970706adbde729ae58ad8d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Global app variables
  var DEF={tugas:5,surat:6,ijazah:15000,min:5000,buku:5000,hlmBuku:40,hrfHlm:1000,g:[3000,7000,15000,2000,5000,10000,1500,3000,6000],kec:0};
  var JASA={tugas:"Tugas",surat:"Surat",ijazah:"Ijazah"};
  var KERTAS={folio:"Folio",a4:"A4",buku:"Buku tulis",sendiri:"Kertas/buku sendiri"};
  var JENIS=["Ilustrasi","Diagram dan bagan","Tabel"],UKUR=["Kecil","Sedang","Besar"];
  var HARI=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],HARIF=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var BLNF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  var orders=[],S=JSON.parse(JSON.stringify(DEF)),loaded=false,dbErr="";
  var route="hari-ini",tab="antre",F=null,editId=null,confirmDel=false,recapMonth=null,detailId=null;
  var $app=document.getElementById("app"),$nav=document.getElementById("nav"),$toast=document.getElementById("toast");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function rp(n){return "Rp "+Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}
  function nf(n){return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}
  function p2(n){return (n<10?"0":"")+n}
  function toast(t){$toast.textContent=t;$toast.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){$toast.hidden=true},2600)}
  function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  function sameDay(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
  function jam(d){return p2(d.getHours())+"."+p2(d.getMinutes())}
  function parseT(s){var d=new Date(s);return isNaN(d)?null:d}
  function fmtT(s,full){
    var d=parseT(s);if(!d)return "-";var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
    var day=sameDay(d,n)?"hari ini":sameDay(d,t)?"besok":HARI[d.getDay()]+", "+d.getDate()+" "+BLN[d.getMonth()];
    if(full)day=day.charAt(0).toUpperCase()+day.slice(1);
    return day+", "+jam(d)}

  function calc(f){
    var L=[],t=0,huruf=+f.huruf||0,j=f.jasa;
    if(j==="ijazah"){var n=+f.lembar||0,a=n*S.ijazah;if(n>0)L.push(["Ijazah ("+n+" lembar x "+rp(S.ijazah)+")",a]);t+=a}
    else{
      var a2=huruf*S[j];if(huruf>0)L.push(["Tulisan ("+nf(huruf)+" x "+rp(S[j])+")",a2]);t+=a2;
      if(f.kertas==="buku"&&huruf>0){var bk=Math.ceil(huruf/(S.hlmBuku*S.hrfHlm));var ab=bk*S.buku;L.push(["Buku tulis ("+bk+" buku)",ab]);t+=ab}
      for(var i=0;i<9;i++){var c=+f.g[i]||0;if(c>0){var ag=c*S.g[i];L.push([JENIS[Math.floor(i/3)]+" "+UKUR[i%3].toLowerCase()+" ("+c+")",ag]);t+=ag}}
    }
    var raw=t;
    if(t>0&&t<S.min){L.push(["Penyesuaian pesanan minimum",S.min-t]);t=S.min}
    return {lines:L,total:t,raw:raw}}
  function ringkas(o){
    var p=[JASA[o.jasa]||o.jasa];
    if(o.jasa==="ijazah")p.push(o.lembar+" lembar");else{p.push(nf(o.huruf)+" huruf");p.push((KERTAS[o.kertas]||"").toLowerCase())}
    if(o.jasa!=="ijazah"){var g=o.g||[];for(var i=0;i<9;i++)if(g[i]>0)p.push(g[i]+" "+JENIS[Math.floor(i/3)].split(" ")[0].toLowerCase()+" "+UKUR[i%3].toLowerCase())}
    return p.join(", ")}

  function byQueue(a,b){var x=(a.tenggat||"").localeCompare(b.tenggat||"");return x||((a.dibayarPada||0)-(b.dibayarPada||0))}
  function antre(){return orders.filter(function(o){return o.dibayar&&o.status==="antre"}).sort(byQueue)}
  function belumBayar(){return orders.filter(function(o){return !o.dibayar&&o.status!=="diambil"}).sort(function(a,b){return (a.tenggat||"").localeCompare(b.tenggat||"")})}
  function selesai(){return orders.filter(function(o){return o.status==="selesai"}).sort(byQueue)}
  function diambil(){return orders.filter(function(o){return o.status==="diambil"}).sort(function(a,b){return (b.tenggat||"").localeCompare(a.tenggat||"")})}
  function flags(q){
    var res={},now=Date.now(),cur=now;
    q.forEach(function(o){
      var d=parseT(o.tenggat),end=d?d.getTime():0,f="";
      if(S.kec>0){cur+=(o.huruf||0)/S.kec*60000;if(d&&cur>end)f="mepet"}
      if(d){if(end<now)f="lewat";else if(!f&&end-now<=3*3600000)f="segera"}
      res[o.id]=f});
    return res}
  function flagPill(f){return f==="lewat"?'<span class="pill red">Lewat tenggat</span>':f==="mepet"?'<span class="pill red">Mepet</span>':f==="segera"?'<span class="pill red">Segera</span>':""}
  function estimasi(o){
    if(!(S.kec>0)||!o.huruf)return "Belum diatur";
    var m=Math.round(o.huruf/S.kec);if(m<60)return "sekitar "+m+" menit";
    var h=Math.floor(m/60),r=m%60;return "sekitar "+h+" jam"+(r?" "+r+" menit":"")}

  var ICON={
   home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
   list:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
   plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
   bar:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
   gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
  function ic(k,s){return '<svg width="'+(s||24)+'" height="'+(s||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'}
  function head(title,sub,extra){
    return '<header><div class="top"><div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'<h1>'+esc(title)+'</h1></div>'+
     '<div style="display:flex;gap:8px"><button class="gear" data-act="logout" title="Keluar Akun" style="background:rgba(255,0,0,0.3)">⎋</button>'+
     '<button class="gear" data-act="go" data-to="pengaturan" aria-label="Pengaturan">'+ic("gear",22)+'</button></div></div>'+(extra||"")+'</header>'}
  function drawNav(){
    var it=[["hari-ini","Hari ini","home"],["pesanan","Pesanan","list"],["tambah","Tambah","plus"],["rekap","Rekap","bar"]];
    $nav.innerHTML=it.map(function(x){return '<a href="#'+x[0]+'" class="'+(route===x[0]?"on":"")+'">'+ic(x[2])+x[1]+'</a>'}).join("")}

  function viewHari(){
    var q=antre(),fl=flags(q),bb=belumBayar(),sl=selesai(),n=new Date();
    var h=head("Hari ini",HARIF[n.getDay()]+", "+n.getDate()+" "+BLNF[n.getMonth()]+" "+n.getFullYear(),
      '<div class="stats"><div class="stat"><b>'+q.length+'</b><span>Antrean</span></div><div class="stat"><b style="color:var(--amb)">'+bb.length+'</b><span>Belum bayar</span></div><div class="stat"><b style="color:var(--grn)">'+sl.length+'</b><span>Siap diambil</span></div></div>');
    var m='<main>';
    if(!loaded)m+='<div class="card empty">Memuat pesanan...</div>';
    else if(!orders.length)m+='<div class="card empty">Belum ada pesanan.<br>Tekan Tambah di bawah untuk mencatat pesanan pertama.</div>';
    else{
      m+='<h2>Kerjakan sekarang</h2>';
      if(q.length){var o=q[0];
        m+='<div class="card"><div class="row"><span class="b" style="font-size:20px;color:var(--blue)">'+esc(o.nama)+'</span>'+flagPill(fl[o.id])+'</div>'+
          '<span class="sm" style="line-height:1.4">'+esc(ringkas(o))+'</span>'+
          '<div class="box2"><div class="box"><span>Diambil</span><b>'+esc(fmtT(o.tenggat,true))+'</b></div><div class="box"><span>Estimasi kerja</span><b>'+esc(estimasi(o))+'</b></div></div>'+
          '<button class="btn" data-act="selesai" data-id="'+o.id+'">Tandai selesai</button>'+
          '<button class="btn o" data-act="detail" data-id="'+o.id+'">Lihat / ubah</button></div>';
        if(q.length>1){m+='<h2>Berikutnya</h2><div style="display:flex;flex-direction:column;gap:10px">';
          q.slice(1,6).forEach(function(o,i){m+='<button class="item" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px" data-act="detail" data-id="'+o.id+'"><span class="pill" style="width:32px;height:32px;display:grid;place-items:center;border-radius:50%;padding:0;font-size:15px">'+(i+2)+'</span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><b>'+esc(o.nama)+'</b><span class="sm muted">'+esc(ringkas(o))+'</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><span class="muted" style="font-size:12px">'+esc(fmtT(o.tenggat).split(", ")[0])+'</span><b style="font-size:14px">'+esc(fmtT(o.tenggat).split(", ").pop())+'</b></span></button>'});
          m+='</div>'}
      }else m+='<div class="card empty">Tidak ada pesanan lunas yang menunggu dikerjakan.</div>';
      if(sl.length){m+='<h2 style="color:var(--grn)">Siap diambil</h2><div class="card list">';
        sl.forEach(function(o){m+='<div class="row"><div style="flex:1;min-width:0"><b>'+esc(o.nama)+'</b><div class="sm muted">'+esc(fmtT(o.tenggat,true))+'</div></div><button class="btn o" data-act="diambil" data-id="'+o.id+'">Sudah diambil</button></div>'});
        m+='</div>'}
      if(bb.length){m+='<h2 style="color:var(--amb)">Menunggu pembayaran</h2><div class="card list">';
        bb.forEach(function(o){m+='<div class="row"><button style="flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer" data-act="detail" data-id="'+o.id+'"><b>'+esc(o.nama)+'</b><div class="sm muted">'+rp(o.harga)+'</div></button><button class="btn o" data-act="lunas" data-id="'+o.id+'">Tandai lunas</button></div>'});
        m+='</div>'}
    }
    return h+m+'</main>'}

  function viewPesanan(){
    var q=antre(),fl=flags(q),L={antre:q,belum:belumBayar(),selesai:selesai(),diambil:diambil()};
    var T=[["antre","Antrean"],["belum","Belum bayar"],["selesai","Selesai"],["diambil","Diambil"]];
    var h=head("Semua pesanan","Diurutkan dari tenggat terdekat");
    var m='<main><div class="tabs" role="tablist">'+T.map(function(t){var c=L[t[0]].length;return '<button class="tab'+(tab===t[0]?" on":"")+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+(c?" "+c:"")+'</button>'}).join("")+'</div>';
    var l=L[tab];
    if(!loaded)m+='<div class="card empty">Memuat pesanan...</div>';
    else if(!l.length)m+='<div class="card empty">'+(tab==="antre"?"Antrean kosong.":tab==="belum"?"Semua pesanan sudah dibayar.":tab==="selesai"?"Belum ada yang selesai.":"Belum ada yang diambil.")+'</div>';
    else{m+='<div style="display:flex;flex-direction:column;gap:10px">';
      l.forEach(function(o,i){
        var pill=tab==="antre"?flagPill(fl[o.id]):tab==="belum"?'<span class="pill amb">Belum bayar</span>':tab==="selesai"?'<span class="pill grn">Selesai</span>':'<span class="pill">Diambil</span>';

  function monthKey(d){return d.getFullYear()*12+d.getMonth()}
  function viewRekap(){
    var now=new Date();if(recapMonth==null)recapMonth=monthKey(now);
    var y=Math.floor(recapMonth/12),mo=recapMonth%12;
    var paid=orders.filter(function(o){return o.dibayar&&o.dibayarPada});
    function inM(k){return paid.filter(function(o){return monthKey(new Date(o.dibayarPada))===k})}
    var cur=inM(recapMonth),prev=inM(recapMonth-1),sum=function(a){return a.reduce(function(s,o){return s+(o.harga||0)},0)};
    var inc=sum(cur),pinc=sum(prev);
    var days=new Date(y,mo+1,0).getDate(),nb=days>28?5:4,wk=[];for(var i=0;i<nb;i++)wk.push(0);
    cur.forEach(function(o){var d=new Date(o.dibayarPada).getDate();wk[Math.min(nb-1,Math.floor((d-1)/7))]+=o.harga||0});
    var mx=Math.max.apply(null,wk.concat([1]));
    var jc={tugas:0,surat:0,ijazah:0};cur.forEach(function(o){jc[o.jasa]=(jc[o.jasa]||0)+1});
    var jm=Math.max(1,jc.tugas,jc.surat,jc.ijazah);
    var delta=pinc>0?Math.round((inc-pinc)/pinc*100):null;
    var h=head("Rekap","",'<div class="monthbar"><button data-act="mprev">&lt;</button><span>'+BLNF[mo]+' '+y+'</span><button data-act="mnext">&gt;</button></div>');

     '<div class="box2" style="margin-top:10px"><div class="box"><span>Jumlah pesanan</span><b style="font-size:20px">'+cur.length+'</b></div><div class="box"><span>Rata-rata per pesanan</span><b style="font-size:20px">'+rp(cur.length?inc/cur.length:0)+'</b></div></div></div>'+
     '<div class="card"><b style="color:var(--blue)">Pemasukan per minggu</b><div class="bars" style="grid-template-columns:repeat('+nb+',minmax(0,1fr))">'+
     wk.map(function(v){return '<div><span>'+(v?nf(v/1000)+" rb":"0")+'</span><i style="height:'+Math.max(3,Math.round(v/mx*110))+'px"></i></div>'}).join("")+'</div>'+
     '<div class="bars" style="grid-template-columns:repeat('+nb+',minmax(0,1fr));height:auto;font-weight:700;color:var(--muted)">'+wk.map(function(v,i){return '<div style="height:auto">Mgg '+(i+1)+'</div>'}).join("")+'</div></div>'+

     '<div class="card list" style="padding-block:6px">'+[recapMonth-2,recapMonth-1].map(function(k){var a=inM(k);return '<div class="row"><b>'+BLNF[k%12]+'</b><span>'+a.length+' pesanan</span><b>'+rp(sum(a))+'</b></div>'}).join("")+'</div>'+

  function simpan(){
    var f=F,err="",c=calc(f);
    if(!f.nama.trim())err="Isi nama pelanggan.";
    else if(f.jasa==="ijazah"?!(+f.lembar>0):!(num(f.huruf)>0))err=f.jasa==="ijazah"?"Isi jumlah lembar.":"Isi jumlah huruf.";
    else if(!f.tgl||!f.jam)err="Isi tanggal dan jam tenggat.";
    if(err){document.getElementById("ferr").innerHTML='<div class="warn">'+err+'</div>';return}
    var old=editId?orders.filter(function(o){return o.id===editId})[0]:null;
    var id=editId||doc(collection(db,"pesanan")).id;
    var wasPaid=old?old.dibayar:false;
    var data={nama:f.nama.trim(),wa:f.wa.trim(),jasa:f.jasa,huruf:f.jasa==="ijazah"?0:num(f.huruf),lembar:f.jasa==="ijazah"?+f.lembar:0,
      kertas:f.jasa==="ijazah"?"folio":f.kertas,g:f.jasa==="ijazah"?[0,0,0,0,0,0,0,0,0]:f.g.slice(),tenggat:f.tgl+"T"+f.jam,harga:c.total,catatan:f.catatan.trim(),
      dibayar:f.dibayar,dibayarPada:f.dibayar?(wasPaid&&old.dibayarPada?old.dibayarPada:Date.now()):0,
      status:old?old.status:"antre",dibuat:old?old.dibuat:Date.now()};

  function ekspor(){
    var rows=[["Nama","WhatsApp","Jasa","Huruf","Lembar","Kertas","Gambar","Tenggat","Total","Dibayar","Tanggal lunas","Status","Catatan"]];
    orders.slice().sort(byQueue).forEach(function(o){
      var gm=[];(o.g||[]).forEach(function(c,i){if(c>0)gm.push(c+" "+JENIS[Math.floor(i/3)]+" "+UKUR[i%3])});
      rows.push([o.nama,o.wa,JASA[o.jasa],o.huruf,o.lembar,KERTAS[o.kertas],gm.join("; "),(o.tenggat||"").replace("T"," "),o.harga,o.dibayar?"ya":"tidak",o.dibayarPada?new Date(o.dibayarPada).toISOString().slice(0,16).replace("T"," "):"",o.status,o.catatan])});
    var csv="\ufeff"+rows.map(function(r){return r.map(function(v){v=v==null?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\r\n");
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "pesanan-tulisin.csv";
    link.click();
    toast("File tersimpan");
  }

  document.getElementById("btn-login").addEventListener("click", function(){
    var email = document.getElementById("login-email").value.trim();
    var pass = document.getElementById("login-pass").value;
    var errEl = document.getElementById("login-err");
    
    if(!email || !pass){
      errEl.innerHTML = '<div class="warn" style="margin-top:10px;">Isi email dan password dengan lengkap.</div>';
      return;
    }

    signInWithEmailAndPassword(auth, email, pass)
      .then(function(){
        errEl.innerHTML = "";
        toast("Berhasil masuk!");
      })
      .catch(function(error){
        errEl.innerHTML = '<div class="warn" style="margin-top:10px;">Gagal login: Periksa kembali email dan password Anda.</div>';
      });
  });
</script>

</body>
</html>
